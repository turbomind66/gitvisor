<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitVisor · 本地仓库控制台</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --green:#3fb950;
    --red:#f85149; --amber:#d29922; --purple:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--accent);text-decoration:none}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  header .logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  header .sub{color:var(--muted);font-size:12px}
  main{max-width:1180px;margin:0 auto;padding:18px}
  .grid{display:grid;grid-template-columns:230px 1fr;gap:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px}
  .card h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .repolist{list-style:none;margin:0;padding:6px}
  .repolist li{padding:8px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .repolist li:hover{background:var(--panel2)}
  .repolist li.active{background:#1f6feb22;border:1px solid #2f81f755}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:1px 7px}
  .repometa{padding:12px 14px;color:var(--muted);font-size:12px;word-break:break-all}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;padding:5px 11px}
  button:hover{border-color:#8b949e}
  button.primary{background:var(--green);border-color:var(--green);color:#03230d;font-weight:600}
  button.primary:hover{filter:brightness(1.08)}
  button.danger{color:var(--red);border-color:#f8514966}
  button:disabled{opacity:.45;cursor:not-allowed}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  th{color:var(--muted);font-size:12px;font-weight:500}
  tr:last-child td{border-bottom:none}
  .mono{font-family:"Cascadia Code",Consolas,"Courier New",monospace}
  .pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);margin-left:6px}
  .pill.current{color:var(--green);border-color:#3fb95066}
  .pill.base{color:var(--accent);border-color:#2f81f766}
  .pill.ahead{color:var(--green);border-color:#3fb95066}
  .pill.behind{color:var(--amber);border-color:#d2992266}
  .branch{font-weight:600}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .muted{color:var(--muted)}
  .bar{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
  .bar .grow{flex:1}
  dialog{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:0;width:min(1020px,94vw);max-height:88vh}
  dialog::backdrop{background:#000a}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}
  .dlg-head .grow{flex:1}
  .dlg-body{padding:14px 16px;overflow:auto;max-height:74vh}
  .commit{padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:var(--panel)}
  .commit .subj{font-weight:600}
  .commit .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .diffbox{margin-top:10px;border:1px solid var(--border);border-radius:6px;overflow:auto;max-height:44vh;background:#0b0f14}
  pre{margin:0;font-family:"Cascadia Code",Consolas,monospace;font-size:12px;line-height:1.5}
  .d-line{white-space:pre;padding:0 10px}
  .d-add{background:#2ea04326;color:#7ee787}
  .d-del{background:#f8514926;color:#ffa198}
  .d-hunk{background:#388bfd26;color:#79c0ff}
  .d-file{color:var(--muted);border-top:1px solid var(--border);padding-top:4px;margin-top:4px;font-weight:600}
  .d-meta{color:var(--muted)}
  .empty{color:var(--muted);padding:26px;text-align:center}
  .err{color:var(--red)}
  .stat{margin:6px 0 10px;color:var(--muted);font-size:12px;white-space:pre-wrap}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:8px;box-shadow:0 6px 24px #000a;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.ok{border-color:#3fb95066}
  .toast.bad{border-color:#f8514966}
  .subtabs{display:flex;gap:6px;margin:8px 0 6px}
  .subtabs button{padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;font-size:12px}
  .subtabs button.active{background:var(--panel2);color:var(--text);border-color:#58a6ff66}
  .filelist{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:6px 0;max-height:280px;overflow-y:auto}
  .filerow{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border)}
  .filerow:last-child{border-bottom:none}
  .filerow:hover{background:var(--panel2)}
  .filerow.selected{background:#1f6feb22;border-left:3px solid var(--blue)}
  .fst{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;min-width:26px;text-align:center;flex-shrink:0}
  .fst-A{background:#3fb95033;color:#3fb950}
  .fst-M{background:#d2992233;color:#d29922}
  .fst-D{background:#f8514933;color:#f85149}
  .fst-R{background:#a371f733;color:#a371f7}
  .fst-C{background:#58a6ff33;color:#58a6ff}
  .filediff{margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>GitVisor</div>
  <span class="sub">本地仓库控制台 · 不联网 · 不推送远程</span>
  <span class="grow" style="flex:1"></span>
  <button id="refreshBtn" title="重新扫描仓库目录">刷新</button>
</header>

<main>
  <div class="grid">
    <aside class="card">
      <h3>仓库</h3>
      <ul class="repolist" id="repolist"></ul>
    </aside>
    <section class="card" id="detail">
      <div class="empty">选择左侧一个仓库查看分支与历史</div>
    </section>
  </div>
</main>

<dialog id="dlg">
  <div class="dlg-head">
    <strong id="dlgTitle">对比</strong>
    <span style="flex:1"></span>
    <input id="searchInput" placeholder="搜索提交…" style="padding:5px 9px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);width:190px" />
    <button class="danger" id="revertMergeBtn" style="display:none">回退此合并</button>
    <button class="primary" id="mergeBtn">合并到目标分支</button>
    <button id="closeBtn">关闭</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<dialog id="branchDlg">
  <div class="dlg-head">
    <strong>新建分支</strong><span class="grow"></span>
    <button id="branchClose">关闭</button>
  </div>
  <div class="dlg-body">
    <div style="display:flex;flex-direction:column;gap:12px;max-width:420px">
      <label>分支名<input id="branchName" class="mono" style="margin-top:4px;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);width:100%" placeholder="如 feature-x" /></label>
      <label>从以下分支创建
        <select id="branchFrom" style="margin-top:4px;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);width:100%"></select>
      </label>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="branchCheckout" /> 创建后切换到该分支（会改动工作区）</label>
      <div><button class="primary" id="branchCreate">创建分支</button></div>
      <div class="err" id="branchErr"></div>
    </div>
  </div>
</dialog>

<dialog id="tagDlg">
  <div class="dlg-head"><strong>标签</strong><span class="grow"></span><button id="tagClose">关闭</button></div>
  <div class="dlg-body" id="tagBody"></div>
</dialog>

<dialog id="cherryDlg">
  <div class="dlg-head"><strong>挑选提交到分支</strong><span style="flex:1"></span><button id="cherryClose">关闭</button></div>
  <div class="dlg-body" id="cherryBody"></div>
</dialog>

<dialog id="compareDlg">
  <div class="dlg-head"><strong>对比两个引用</strong><span style="flex:1"></span><button id="compareClose">关闭</button></div>
  <div class="dlg-body" id="compareBody"></div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let state = { repos:[], current:null, detail:null, diffCtx:null, tags:[] }; let openArgs = null;

function toast(msg, kind=''){ const t=$('#toast'); t.textContent=msg; t.className='toast show '+kind; setTimeout(()=>t.className='toast '+kind,2600); }
async function api(url, opts){ const r=await fetch(url, opts); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadRepos(){
  const {repos} = await api('/api/repos');
  state.repos = repos;
  const ul = $('#repolist'); ul.innerHTML='';
  if(!repos.length){ ul.innerHTML='<li class="muted">未发现仓库</li>'; }
  repos.forEach(r=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="mono">${esc(r.name)}</span><span class="tag">仓库</span>`;
    li.onclick=()=>selectRepo(r.id);
    li.dataset.id=r.id;
    ul.appendChild(li);
  });
  const deep = new URLSearchParams(location.search).get('repo');
  if (deep && repos.some(r=>r.id===deep)) selectRepo(deep);
  else if (repos[0]) selectRepo(repos[0].id);
}
async function selectRepo(id){
  state.current=id;
  try { history.replaceState(null,'', '?repo='+encodeURIComponent(id)); } catch {}
  document.querySelectorAll('.repolist li').forEach(li=>li.classList.toggle('active', li.dataset.id===id));
  const d = await api('/api/repo/'+encodeURIComponent(id));
  state.detail=d;
  try { const tg = await api('/api/repo/'+encodeURIComponent(id)+'/tags'); state.tags = tg.tags || []; } catch { state.tags = []; }
  renderDetail();
}
function branchPills(b){
  let s='';
  if(b.current) s+='<span class="pill current">当前</span>';
  if(b.base) s+='<span class="pill base">主干</span>';
  else if(b.merged) s+='<span class="pill" style="border-color:#a371f766;color:#a371f7">已合并</span>';
  if(b.ahead>0) s+=`<span class="pill ahead">领先 ${b.ahead}</span>`;
  if(b.behind>0) s+=`<span class="pill behind">落后 ${b.behind}</span>`;
  return s;
}
function renderDetail(){
  const d=state.detail; if(!d) return;
  const tags = state.tags||[];
  const rows = d.branches.map(b=>`
    <tr>
      <td class="mono branch">${esc(b.name)} ${branchPills(b)}</td>
      <td class="mono muted">${esc(b.hash)}</td>
      <td>${esc(b.author)}</td>
      <td class="muted">${esc(b.when)}</td>
      <td class="muted">${esc(b.subject)}</td>
      <td><div class="row-actions">
        ${d.baseRef && b.name!==d.baseRef ? `<button data-act="review" data-b="${esc(b.name)}">审查</button>` : ''}
        ${!b.current && !b.base ? `<button class="danger" data-act="del" data-b="${esc(b.name)}">删除</button>` : ''}
      </div></td>
    </tr>`).join('');
  $('#detail').innerHTML = `
    <div class="bar">
      <strong class="mono">${esc(d.name)}</strong>
      <span class="pill ${d.bare?'':'base'}">${d.bare?'裸仓库':'普通仓库'}</span>
      ${d.current?`<span class="muted">当前分支: <b class="mono">${esc(d.current)}</b></span>`:''}
      ${d.dirty?'<span class="pill behind">有未提交改动</span>':''}
      ${tags.length?`<span class="pill base">标签 ${tags.length}</span>`:''}
      <span class="grow"></span>
      <button data-act="newbranch">新建分支</button>
      <button data-act="tags">标签</button>
      <button data-act="compare">对比</button>
      <button data-act="history">全部提交</button>
    </div>
    <div class="repometa mono">${esc(d.path)}</div>
    <table>
      <thead><tr><th>分支</th><th>最新</th><th>作者</th><th>时间</th><th>说明</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">没有分支</td></tr>'}</tbody>
    </table>`;
  $('#detail').querySelectorAll('button[data-act]').forEach(btn=>{
    const act=btn.dataset.act;
    if(act==='review') btn.onclick=()=>openReview(d.baseRef, btn.dataset.b);
    if(act==='del') btn.onclick=()=>delBranch(btn.dataset.b);
    if(act==='history') btn.onclick=()=>openReview(d.baseRef||d.current, d.baseRef||d.current, {allHistory:true});
    if(act==='compare') btn.onclick=openCompare;
    if(act==='newbranch') btn.onclick=openBranchModal;
    if(act==='tags') btn.onclick=openTags;
  });
}
async function openReview(base, head, opts = {}){
  const d=state.detail;
  openArgs = { base, head, opts };
  const allHistory = !!opts.allHistory;
  const isMerged = !!opts.merged;
  const compare = !!opts.compare;
  let data, ctx;
  if(isMerged){
    data = await api(`/api/repo/${d.id}/diff?base=${encodeURIComponent(base)}&head=${encodeURIComponent(opts.mergeCommit)}&merged=1`);
    ctx = {base, head, merged:true, mergeCommit:opts.mergeCommit};
  } else if(allHistory || base===head){
    const commits = (await api(`/api/repo/${d.id}/log?ref=${encodeURIComponent(head)}`)).commits;
    data = {base, head, stat:'', diff:'', commits};
    ctx = {base, head, merged:false, allHistory:true};
  } else {
    const q = `base=${encodeURIComponent(base)}&head=${encodeURIComponent(head)}${compare?'&twoDot=1':''}`;
    data = await api(`/api/repo/${d.id}/diff?${q}`);
    ctx = {base, head, merged:false, compare, twoDot: compare};
  }
  state.diffCtx = ctx;
  $('#dlgTitle').innerHTML = isMerged
    ? `已合并：<span class="mono">${esc(head)}</span> → <span class="mono">${esc(base)}</span>`
    : (allHistory ? `提交历史：<span class="mono">${esc(head)}</span>`
       : (compare ? `对比：<span class="mono">${esc(base)}</span> … <span class="mono">${esc(head)}</span>`
          : `审查：<span class="mono">${esc(base)}</span> ← <span class="mono">${esc(head)}</span>`));
  const showMerge = !isMerged && !allHistory && !compare;
  $('#mergeBtn').style.display = showMerge ? '' : 'none';
  $('#mergeBtn').disabled = false;
  $('#mergeBtn').textContent = `合并 ${head} → ${base}`;
  $('#revertMergeBtn').style.display = isMerged ? '' : 'none';
  $('#revertMergeBtn').disabled = false;
  const showRevertCommit = allHistory || isMerged;
  const commits = (data.commits||[]).map(c=>
    `<div class="commit"><div class="subj" style="cursor:pointer" data-commit="${esc(c.hash)}" title="查看此提交改动">${esc(c.subject)}</div>
    <div class="meta mono">${esc(c.short)} · ${esc(c.author)} · ${esc(c.when)} ${c.refs?('· '+esc(c.refs)):''}
      ${showRevertCommit?`<button class="danger" style="margin-left:8px" data-revert="${esc(c.hash)}">回退此提交</button>`:''}
    </div></div>`).join('');
  const enableFiles = !allHistory && !isMerged && !!data.diff;
  const subtabsHtml = enableFiles ? `<div class="subtabs"><button class="active" data-subtab="commits">提交 (${(data.commits||[]).length})</button><button data-subtab="files">文件</button></div>` : '';
  const commitsPaneHtml = `<div data-pane="commits">${isMerged?'<div class="stat">该分支已合并进主干，下方为其引入的改动。可“回退此合并”撤销。':''}${data.stat?`<div class="stat mono">${esc(data.stat)}</div>`:(data.diff?'':'<div class="stat">（无差异）</div>')}<div>${commits}</div>${data.diff?`<div class="diffbox">${renderDiff(data.diff)}</div>`:''}</div>`;
  const filesPaneHtml = enableFiles ? `<div data-pane="files" style="display:none"><div class="muted">点击上方「文件」加载变更列表…</div></div>` : '';
  $('#dlgBody').innerHTML = subtabsHtml + commitsPaneHtml + filesPaneHtml;
  if(enableFiles){
    $('#dlgBody').querySelectorAll('button[data-subtab]').forEach(b=>{
      b.onclick=()=>{
        $('#dlgBody').querySelectorAll('button[data-subtab]').forEach(x=>x.classList.toggle('active', x===b));
        $('#dlgBody').querySelectorAll('[data-pane]').forEach(p=>p.style.display=p.dataset.pane===b.dataset.subtab?'':'none');
        if(b.dataset.subtab==='files' && !$('#dlgBody').dataset.filesLoaded){ loadDiffFiles(); }
      };
    });
  }
  $('#dlg').showModal();
  $('#searchInput').style.display='';
  $('#searchInput').value='';
  $('#dlgBody').querySelectorAll('button[data-revert]').forEach(btn=>{ btn.onclick=()=>revertCommit(btn.dataset.revert); });
  $('#dlgBody').querySelectorAll('div[data-commit]').forEach(el=>{ el.onclick=()=>openCommit(el.dataset.commit); });
  $('#searchInput').oninput=(e)=>{ const q=e.target.value.trim().toLowerCase(); document.querySelectorAll('#dlgBody .commit').forEach(c=>{ c.style.display=(!q||c.textContent.toLowerCase().includes(q))?'':'none'; }); };
}
async function openCompare(){
  const d=state.detail; if(!d) return;
  const refs = (d.branches||[]).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}${b.current?'（当前）':''}</option>`).join('');
  const tags = (state.tags||[]).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}（标签）</option>`).join('');
  const baseVal = d.baseRef || (d.branches[0]&&d.branches[0].name) || '';
  const other = (d.branches.find(b=>!b.base)||{}).name || baseVal;
  $('#compareBody').innerHTML = `
    <p class="muted">选择两个引用（分支或标签），查看它们之间的直接差异（base..head 两点 diff）：</p>
    <div style="display:flex;gap:8px;align-items:center;margin:8px 0">
      <select id="cmpA" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)">${refs}${tags}</select>
      <span class="muted">…</span>
      <select id="cmpB" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)">${refs}${tags}</select>
    </div>
    <div><button class="primary" id="cmpGo">查看差异</button> <span class="err" id="cmpErr"></span></div>`;
  $('#cmpA').value = baseVal; $('#cmpB').value = other;
  $('#cmpGo').onclick = () => {
    const a=$('#cmpA').value, b=$('#cmpB').value;
    if(!a||!b){ $('#cmpErr').textContent='请选择两个引用'; return; }
    $('#compareDlg').close();
    openReview(a, b, {compare:true});
  };
  $('#compareDlg').showModal();
}
async function loadDiffFiles(){
  const d=state.detail, ctx=state.diffCtx;
  const pane = $('#dlgBody').querySelector('[data-pane="files"]');
  pane.innerHTML='<div class="muted">加载中…</div>';
  try{
    const r = await api(`/api/repo/${d.id}/files?base=${encodeURIComponent(ctx.base)}&head=${encodeURIComponent(ctx.head)}&twoDot=${ctx.twoDot?1:0}`);
    if(!r.files.length){ pane.innerHTML='<div class="muted">无文件变化</div>'; $('#dlgBody').dataset.filesLoaded='1'; return; }
    pane.innerHTML = `<div class="filelist">${r.files.map((f,i)=>`<div class="filerow" data-i="${i}" data-file="${esc(f.path)}"><span class="fst fst-${esc((f.status||'?')[0])}">${esc(f.status)}</span><span class="mono">${esc(f.path)}</span></div>`).join('')}</div><div class="filediff" id="fileDiffBox"><div class="muted">选择左侧文件查看差异</div></div>`;
    pane.querySelectorAll('.filerow').forEach(row=>{
      row.onclick=()=>{
        pane.querySelectorAll('.filerow').forEach(x=>x.classList.toggle('selected', x===row));
        loadFileDiff(row.dataset.file);
      };
    });
    pane.querySelector('.filerow').click();
    $('#dlgBody').dataset.filesLoaded='1';
  }catch(e){ pane.innerHTML='<div class="err">加载失败：'+esc(e.message)+'</div>'; }
}
async function loadFileDiff(file){
  const box = $('#fileDiffBox'); if(!box) return;
  box.innerHTML='<div class="muted">加载中…</div>';
  const d=state.detail, ctx=state.diffCtx;
  try{
    const r = await api(`/api/repo/${d.id}/filediff?base=${encodeURIComponent(ctx.base)}&head=${encodeURIComponent(ctx.head)}&file=${encodeURIComponent(file)}&twoDot=${ctx.twoDot?1:0}`);
    box.innerHTML = r.diff ? `<div class="diffbox">${renderDiff(r.diff)}</div>` : '<div class="muted">该文件无差异</div>';
  }catch(e){ box.innerHTML='<div class="err">加载失败：'+esc(e.message)+'</div>'; }
}
async function openCommit(hash){
  const d=state.detail;
  let c;
  try { c = await api(`/api/repo/${d.id}/commit?hash=${encodeURIComponent(hash)}`); }
  catch(e){ toast('加载提交失败：'+e.message,'bad'); return; }
  $('#dlgTitle').innerHTML = `提交详情：<span class="mono">${esc(c.short)}</span>`;
  $('#mergeBtn').style.display='none';
  $('#revertMergeBtn').style.display='none';
  $('#searchInput').style.display='none';
  $('#dlgBody').innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <button id="backBtn">← 返回</button>
      <span style="flex:1"></span>
      <button data-cherry="${esc(c.hash)}">挑选到目标分支</button>
      <button class="danger" data-revert="${esc(c.hash)}">回退此提交</button>
    </div>
    <div class="stat mono">${esc(c.author)} · ${esc(c.when)} ${c.refs?('· '+esc(c.refs)):''}</div>
    <div class="stat mono">${esc(c.stat)}</div>
    <div class="commit"><div class="subj">${esc(c.subject)}</div></div>
    <div class="diffbox">${renderDiff(c.diff)}</div>`;
  $('#dlg').showModal();
  $('#backBtn').onclick=()=>openReview(openArgs.base, openArgs.head, openArgs.opts);
  $('#dlgBody').querySelector('button[data-revert]').onclick=()=>revertCommit(c.hash);
  $('#dlgBody').querySelector('button[data-cherry]').onclick=()=>openCherry(c.hash);
}

function renderDiff(text){
  return text.split('\n').map(l=>{
    let cls='d-line';
    if(l.startsWith('diff --git')||l.startsWith('index ')||l.startsWith('--- ')||l.startsWith('+++ ')||l.startsWith('new file')||l.startsWith('deleted file')||l.startsWith('similarity')) cls+=' d-meta';
    else if(l.startsWith('@@')) cls+=' d-hunk';
    else if(l.startsWith('+')) cls+=' d-add';
    else if(l.startsWith('-')) cls+=' d-del';
    return `<div class="${cls}">${esc(l)||'&nbsp;'}</div>`;
  }).join('');
}
async function doMerge(){
  const d=state.detail; const ctx=state.diffCtx;
  if(ctx.merged) return;
  $('#mergeBtn').disabled=true;
  try{
    await api(`/api/repo/${d.id}/merge`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:ctx.head,target:ctx.base})});
    toast(`已合并 ${ctx.head} → ${ctx.base}`,'ok');
    $('#dlg').close(); await selectRepo(d.id);
  }catch(e){ toast('合并失败：'+e.message,'bad'); }
  finally{ $('#mergeBtn').disabled=false; }
}
async function revertMerge(){
  const d=state.detail; const ctx=state.diffCtx;
  if(!ctx.merged) return;
  if(!confirm(`确定回退合并 ${ctx.head}？将生成一个反向提交（历史不丢失，主干回到合并前状态）。`)) return;
  $('#revertMergeBtn').disabled=true;
  try{
    await api(`/api/repo/${d.id}/revert-merge`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({branch:ctx.head,target:ctx.base,mergeCommit:ctx.mergeCommit})});
    toast(`已回退合并 ${ctx.head}（生成反向提交）`,'ok');
    $('#dlg').close(); await selectRepo(d.id);
  }catch(e){ toast('回退失败：'+e.message,'bad'); }
  finally{ $('#revertMergeBtn').disabled=false; }
}
async function revertCommit(hash){
  const d=state.detail; const ctx=state.diffCtx;
  const target = (ctx && ctx.base) || d.baseRef;
  if(!confirm(`确定回退提交 ${hash.slice(0,7)}？将生成一个反向提交（历史不丢失）。`)) return;
  try{
    await api(`/api/repo/${d.id}/revert-commit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({commit:hash,target})});
    toast('已回退该提交','ok');
    $('#dlg').close(); await selectRepo(d.id);
  }catch(e){ toast('回退失败：'+e.message,'bad'); }
}
async function delBranch(name){
  if(!confirm(`确定删除分支 ${name}？该操作不可恢复。`)) return;
  try{ await api(`/api/repo/${state.detail.id}/branch/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    toast(`已删除分支 ${name}`,'ok'); await selectRepo(state.detail.id);
  }catch(e){ toast('删除失败：'+e.message,'bad'); }
}
$('#refreshBtn').onclick=()=>loadRepos();
$('#closeBtn').onclick=()=>$('#dlg').close();
$('#mergeBtn').onclick=doMerge;
$('#revertMergeBtn').onclick=revertMerge;
// ---- 新建分支 ----
function openBranchModal(){
  const d=state.detail; if(!d) return;
  const sel=$('#branchFrom'); sel.innerHTML='';
  d.branches.forEach(b=>{
    const o=document.createElement('option'); o.value=b.name; o.textContent=b.name+(b.current?' (当前)':''); sel.appendChild(o);
  });
  if(d.baseRef) sel.value=d.baseRef;
  $('#branchName').value=''; $('#branchErr').textContent='';
  $('#branchDlg').showModal();
}
async function createBranch(){
  const d=state.detail;
  const name=$('#branchName').value.trim();
  const from=$('#branchFrom').value;
  const checkout=$('#branchCheckout').checked;
  $('#branchErr').textContent='';
  try{
    await api(`/api/repo/${d.id}/branch`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,from,checkout})});
    toast(`已创建分支 ${name}`,'ok');
    $('#branchDlg').close(); await selectRepo(d.id);
  }catch(e){ $('#branchErr').textContent='创建失败：'+e.message; }
}

// ---- 标签管理 ----
async function openTags(){
  const d=state.detail; if(!d) return;
  try { const tg = await api(`/api/repo/${d.id}/tags`); state.tags = tg.tags||[]; } catch { state.tags=[]; }
  renderTags();
  $('#tagDlg').showModal();
}
function renderTags(){
  const d=state.detail;
  const tags = state.tags||[];
  const list = tags.length ? tags.map(t=>
    `<div class="commit"><div class="subj">${esc(t.name)} <span class="muted mono">${esc(t.hash)}</span> <span class="muted">${esc(t.when||'')}</span></div><div class="meta">${esc(t.subject||'')} <button class="danger" style="margin-left:8px" data-deltag="${esc(t.name)}">删除</button></div></div>`
  ).join('') : '<div class="empty">暂无标签</div>';
  const refs = (d.branches||[]).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');
  $('#tagBody').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      <div class="muted" style="font-size:12px">基于（留空=当前 HEAD）：</div>
      <select id="tagRef" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)">${refs}<option value="">HEAD（当前）</option></select>
      <input id="tagName" class="mono" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)" placeholder="标签名，如 v0.1" />
      <input id="tagMsg" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)" placeholder="附注说明（可选，留空为轻量标签）" />
      <div><button class="primary" id="tagCreate">创建标签</button> <span class="err" id="tagErr"></span></div>
    </div>
    <h3 style="color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:6px 0">已有标签</h3>
    ${list}`;
  $('#tagCreate').onclick=createTag;
  $('#tagBody').querySelectorAll('button[data-deltag]').forEach(btn=>{ btn.onclick=()=>deleteTag(btn.dataset.deltag); });
}
async function createTag(){
  const d=state.detail;
  const name=$('#tagName').value.trim();
  const ref=$('#tagRef').value;
  const message=$('#tagMsg').value;
  $('#tagErr').textContent='';
  try{
    await api(`/api/repo/${d.id}/tag`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,ref,message})});
    toast(`已创建标签 ${name}`,'ok');
    const tg=await api(`/api/repo/${d.id}/tags`); state.tags=tg.tags||[];
    const d2=await api(`/api/repo/${d.id}`); state.detail=d2; renderDetail(); renderTags();
  }catch(e){ $('#tagErr').textContent='创建失败：'+e.message; }
}
async function deleteTag(name){
  if(!confirm(`确定删除标签 ${name}？`)) return;
  const d=state.detail;
  try{
    await api(`/api/repo/${d.id}/tag/delete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    toast(`已删除标签 ${name}`,'ok');
    const tg=await api(`/api/repo/${d.id}/tags`); state.tags=tg.tags||[];
    const d2=await api(`/api/repo/${d.id}`); state.detail=d2; renderDetail(); renderTags();
  }catch(e){ toast('删除失败：'+e.message,'bad'); }
}

$('#branchClose').onclick=()=>$('#branchDlg').close();
$('#branchCreate').onclick=createBranch;
$('#tagClose').onclick=()=>$('#tagDlg').close();
$('#cherryClose').onclick=()=>$('#cherryDlg').close();
$('#compareClose').onclick=()=>$('#compareDlg').close();
loadRepos().catch(e=>toast('加载失败：'+e.message,'bad'));

// ---- 挑选提交（cherry-pick） ----
let cherryHash = null;
async function openCherry(hash){
  const d=state.detail; if(!d) return;
  cherryHash = hash;
  const opts = (d.branches||[]).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}${b.current?'（当前）':''}</option>`).join('');
  $('#cherryBody').innerHTML = `
    <p class="muted">将提交 <span class="mono">${esc(hash.slice(0,7))}</span> 挑选到目标分支（生成一个新的提交，不改动原分支）：</p>
    <div style="display:flex;gap:8px;align-items:center;margin:10px 0">
      <select id="cherryTarget" style="padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text)">${opts}</select>
    </div>
    <div><button class="primary" id="cherryGo">确认挑选</button> <span class="err" id="cherryErr"></span></div>`;
  const sel=$('#cherryTarget'); if(d.baseRef) sel.value=d.baseRef;
  $('#cherryGo').onclick=doCherry;
  $('#cherryDlg').showModal();
}
async function doCherry(){
  const d=state.detail;
  const target=$('#cherryTarget').value;
  $('#cherryErr').textContent='';
  try{
    await api(`/api/repo/${d.id}/cherry-pick`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,hash:cherryHash})});
    toast(`已挑选提交到 ${target}`,'ok');
    $('#cherryDlg').close(); await selectRepo(d.id);
  }catch(e){ $('#cherryErr').textContent='挑选失败：'+e.message; }
}
</script>
</body>
